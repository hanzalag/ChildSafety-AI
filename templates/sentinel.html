{% extends "base.html" %}
{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
    <div style="margin-bottom: 2rem;">
        <h2>💬 SafeChat Sentinel</h2>
        <p style="color: var(--text-muted); margin-top: 0.5rem;">Test youth messages or incoming chats for cyberbullying, toxicity, grooming risks, and emotional distress.</p>
    </div>

    <div class="card">
        <div class="form-group">
            <label class="form-label" for="sentinel-input">Message Text to Scan</label>
            <textarea id="sentinel-input" class="form-control" placeholder="Type or paste a chat message here (e.g. 'Nobody likes you, you should just disappear...')..."></textarea>
        </div>
        <button onclick="analyzeSentinelMessage()" class="btn btn-primary">Scan Message with AI</button>

        <div id="sentinel-result" class="result-box"></div>
    </div>
</div>
{% endblock %}
